<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Готэм: Дела стажёра</title>
<meta name="description" content="Интерактивный детектив: ты — новый Робин на стажировке у Бэтмена.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- общие узоры для комиксной графики -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="4" cy="4" r="1.7" fill="#fff"/>
    </pattern>
    <pattern id="htk" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="3.5" cy="3.5" r="1.6" fill="#000"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2.2" height="7" fill="#fff"/>
    </pattern>
    <!-- меловой контур вокруг силуэта: кольцо из расширенной альфы + шероховатость -->
    <filter id="chalk" x="-20%" y="-30%" width="140%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="o"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="7.5" result="i"/>
      <feComposite in="o" in2="i" operator="out" result="ring"/>
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="ring" in2="n" scale="4" result="rough"/>
      <feComposite in="rough" in2="n" operator="in" result="grain"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="rough" operator="in" result="w"/>
      <feMerge><feMergeNode in="w"/></feMerge>
    </filter>
    <pattern id="hatchk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="2.4" height="6" fill="#000"/>
    </pattern>
  </defs>
</svg>

<!-- ============ ЗАСТАВКА (пиксели) ============ -->
<section id="intro" class="screen active">
  <canvas id="road" class="px-canvas" width="320" height="180"></canvas>
  <div class="intro-ui">
    <header class="px-head">
      <h1 class="px-title">ГОТЭМ<span>ДЕЛА СТАЖЁРА</span></h1>
      <p class="px-sub" id="pxSub">Патруль. Ночь. Дождь.</p>
    </header>
    <div id="files" class="files" hidden>
      <p class="px-prompt">ВЫБЕРИ ДЕЛО, РОБИН</p>
      <div class="stack" id="stack"></div>
    </div>
    <div id="diff" class="diff" hidden>
      <p class="px-line" id="diffCase"></p>
      <p class="px-prompt">ВЫБЕРИ СЛОЖНОСТЬ</p>
      <div class="diff-list" id="diffList"></div>
      <button class="px-btn dim" id="diffBack">← К ДЕЛАМ</button>
    </div>
  </div>
</section>

<!-- ============ ДЕЛО (комикс) ============ -->
<section id="case" class="screen">
  <header class="hud">
    <div class="hud-title"><span id="hudNo">ДЕЛО</span> <b id="hudName"></b></div>
    <div class="hud-stats">
      <div class="stat">СЛОЖНОСТЬ <b id="hudDiff"></b></div>
      <div class="stat">УЛИКИ <b id="hudClues">0/16</b></div>
      <div class="stat">ПОДСКАЗКИ <b id="hudHints">0</b></div>
      <button id="detBtn" class="det-btn" aria-pressed="false">◉ РЕЖИМ ДЕТЕКТИВА</button>
    </div>
  </header>
  <nav class="places" id="places" aria-label="Карта дела: места преступления"></nav>

  <main class="stage">
    <section class="panel-wrap">
      <div class="loc" id="loc"></div>
      <div class="scene" id="scene"></div>
      <div class="narr" id="narr"></div>
    </section>
    <aside class="notebook">
      <h3>БЛОКНОТ СТАЖЁРА</h3>
      <ol id="notes"></ol>
      <p class="empty" id="notesEmpty">Пока пусто. Осмотри место преступления: нажимай на предметы, которые кажутся важными.</p>
      <button id="nextBtn" class="btn red" hidden>СЛЕДУЮЩЕЕ МЕСТО →</button>
    </aside>
  </main>

  <!-- загадка -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Закрыть">×</button></header>
      <div class="m-body">
        <div id="mExhibit" class="exhibit"></div>
        <p id="mQuestion" class="question"></p>
        <div id="mAnswer" class="answer"></div>
        <p id="mFeedback" class="feedback"></p>
        <div id="mConclusion" class="conclusion" hidden></div>
      </div>
      <footer>
        <button class="btn ghost" id="mHint">СПРОСИТЬ БЭТМЕНА</button>
        <button class="btn red" id="mCheck">ПРОВЕРИТЬ</button>
      </footer>
    </div>
  </div>

  <!-- Бэтмен -->
  <div class="bat" id="bat" hidden>
    <div class="bat-face" id="batFace"></div>
    <div class="bat-say"><span class="bat-tag" id="batTag">БЭТМЕН</span><p id="batText"></p><button class="btn red bat-act" id="batAct" hidden></button></div>
    <button class="x" id="batClose" aria-label="Скрыть">×</button>
  </div>

  <!-- сюжетные страницы -->
  <div class="story" id="story" hidden>
    <div class="story-page">
      <div class="story-art" id="storyArt"></div>
      <div class="story-cap" id="storyCap"></div>
      <div class="story-text" id="storyText"></div>
      <button class="btn red" id="storyNext">ДАЛЬШЕ →</button>
    </div>
  </div>
</section>

<!-- ============ ПЕЩЕРА (пиксели) ============ -->
<section id="cave" class="screen">
  <canvas id="caveCanvas" class="px-canvas" width="320" height="180"></canvas>
  <div class="cave-ui">
    <h2 class="px-title small">ДЕЛО ЗАКРЫТО</h2>
    <div class="score-box">
      <p class="score" id="scoreNum">0</p>
      <p class="px-line">ОЧКИ СТАЖИРОВКИ</p>
      <p class="px-line" id="scoreRank"></p>
      <p class="px-line dim" id="scoreDetail"></p>
      <p class="px-quote" id="scoreQuote"></p>
      <button class="px-btn" id="againBtn" style="justify-self:start">К ДЕЛАМ</button>
    </div>
  </div>
</section>

<canvas id="wipe" class="wipe" width="32" height="18"></canvas>

<!-- настройки -->
<button class="set-btn" id="setBtn" aria-label="Настройки" title="Настройки">⚙</button>
<div class="settings" id="settings" hidden>
  <div class="set-card" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <header><h2 id="setTitle">НАСТРОЙКИ</h2><button class="x" id="setClose" aria-label="Закрыть">×</button></header>
    <div class="set-body" id="setBody"></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/pixel.js"></script>
<script src="js/art.js"></script>
<script src="js/art3.js"></script>
<script src="js/case1.js"></script>
<script src="js/case2.js"></script>
<script src="js/case3.js"></script>
<script src="js/game.js"></script>
</body>
</html>
